{% if quote %}
  <div class="my-auto flex flex-col gap-6 pt-8 pb-4">
    <span class="material-symbols-outlined text-xl text-primary/80 opacity-50">format_quote</span>
    <h2 class="font-display text-2xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white sm:text-4xl">
      {{ quote.q }}
    </h2>
    <div class="h-1 w-12 rounded-full bg-primary"></div>
    <p class="font-medium text-slate-500 dark:text-slate-400 text-lg">— {{ quote.a }}</p>
  </div>
{% elif error_message %}
  <div class="my-auto flex flex-col items-center justify-center text-center gap-4 py-10">
    <!-- Icon -->
    <div class="h-12 w-12 flex items-center rounded-full bg-primary/10">
      <span class="material-symbols-outlined text-primary text-5xl">search_off</span>
    </div>

    <!-- Message -->
    <p class="text-lg font-semibold text-slate-800 dark:text-white">
      No quotes found
    </p>
    <p class="text-sm text-slate-500 dark:text-slate-400">
      Try a different keyword or explore the tags below.
    </p>
  </div>

{% endif %}
