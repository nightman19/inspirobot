<!-- Chips / Keywords -->
<div class="px-4 py-3">
  <div class="flex gap-3 overflow-x-auto scrollbar-hide scroll-smooth">
    {% for tag in tags %}
      <button
        hx-get="{% url 'home:quote-partial' %}?keyword={{ tag }}"
        hx-target="#quote-container"
        hx-swap="innerHTML transition:true"
        hx-indicator="#loading-spinner"
        class="whitespace-nowrap px-5 py-2 rounded-full text-sm font-medium transition border
          {% if tag == active_tag %}
            bg-primary text-white border-primary
          {% else %}
            bg-white dark:bg-surface-card dark:bg-surface-dark
            text-slate-600 dark:text-slate-300
            border-slate-200 dark:border-slate-700
            hover:bg-slate-50 dark:hover:bg-slate-800
          {% endif %}
        ">
        {{ tag }}
      </button>
    {% endfor %}
  </div>
</div>
