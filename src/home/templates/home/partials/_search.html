<!-- Search Section -->
<div class="px-4 py-4">

        hx-target="#quote-container"
        hx-swap="innerHTML"
        class="relative flex items-center w-full"   
    >
        <span class="material-symbols-outlined absolute left-4 text-primary pointer-events-none">search</span>
