{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
	<head>
    <title>inspirobot</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<link rel="icon" href="{% static 'favicon.ico' %}">
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
		{% tailwind_css %}
		
	</head>
	
	<body class= "bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white">
		<div class="relative mx-auto flex h-screen w-full max-w-md flex-col overflow-hidden bg-background-light dark:bg-background-dark shadow-2xl">
			{% include "home/partials/_topbar.html" %}
			{% block content %}
			{% endblock content %}
			{% include "home/partials/_bottom_nav.html" %}
		</div>
	</body>


	{% block scripts %}
		<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
	
		<script>
			function getQuotes(){
				const el = document.getElementById("quotes-data");
				if (!el) return []
				try{
					return JSON.parse(el.textContent);
				} catch {
					return [];
				}
			}

			function renderQuote(quote){
				const container = document.getElementById("quote-content");
				if (!container) return;

				container.innerHTML = `
					<div class="my-auto flex flex-col gap-6 pt-8 pb-4">
						<span class="material-symbols-outlined text-4xl text-primary/80 opacity-50">format_quote</span>
						<h2 class="font-display text-2xl font-bold leading-tight text-slate-900 dark:text-white sm:text-4xl">
							${quote.q}
						</h2>
						<div class="h-1 w-12 rounded-full bg-primary"></div>
						<p class="font-medium text-slate-500 dark:text-slate-400 text-lg">— ${quote.a}</p>
					</div>
				`;
			}

			let lastIndex = -1;

			document.body.addEventListener("htmx:configRequest", function (e) {
				const trigger = e.detail.elt;

				if (trigger && trigger.matches("[hx-get*='inspire-me']")) {
					const quotes = getQuotes();

					if (quotes.length > 0) {
						e.preventDefault();

						let index;
						do {
							index = Math.floor(Math.random() * quotes.length);
						} while (index === lastIndex);

						lastIndex = index;

						renderQuote(quotes[index]);
					}
				}
			});
		</script>

		<script>
			document.body.addEventListener('htmx:configRequest', function(event) {
				event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
			});
		</script>

		<script>
			async function shareQuote(text, author){
				const shareText = `"${text}" — ${author}\n\nGet more inspiration at https://inspirobot.onrender.com`;
				

				try{
					if (navigator.share){
						await navigator.share({
							title: "Inspirobot",
							text: shareText,
						});
					}else {
						await navigator.clipboard.writeText(shareText);

						alert("Quote copied to clipboard");
					}
				}catch (error){
					console.log("Share cancelled");
				}
			}
		</script>
	{% endblock scripts %}

</html>
