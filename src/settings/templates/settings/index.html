{% extends "base.html" %}

{% block content %}

<div class="px-4 py-6">

    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold">
            Settings
        </h1>
        <p class="text-slate-400 mt-1">
            Customize your Inspirobot experience
        </p>
    </div>

    <!-- Appearance -->
    <div class="rounded-3xl bg-surface-dark/80 p-5 mb-4">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="font-semibold text-lg">
                    Appearance
                </h2>
                <p class="text-sm text-slate-400">
                    Light or dark mode
                </p>
            </div>

            <span class="material-symbols-outlined text-primary">
                palette
            </span>
        </div>
    </div>


    <!-- About -->
    <div class="rounded-3xl bg-surface-dark/80 p-5 mb-4">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="font-semibold text-lg">
                    About
                </h2>
                <p class="text-sm text-slate-400">
                    Inspirobot MVP v1.0
                </p>
            </div>

            <span class="material-symbols-outlined">
                info
            </span>
        </div>
    </div>

</div>

{% endblock %}
