{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login • Inspirobot</title>
    <link href="{% static 'css/dist/styles.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center px-4">
    <!-- App Container -->
    <div class="w-full max-w-xl">

        <!-- Logo / Title -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-white tracking-tight">
                Inspirobot
            </h1>
            <p class="text-slate-400 text-base mt-2">
                Save your favorite quotes and stay inspired
            </p>
        </div>

        <!-- Card -->
        <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-2xl">

            <h2 class="text-2xl font-semibold text-white mb-6">
                Welcome back
            </h2>

            <!-- Form -->
            <form method="post" class="space-y-4">
                {% csrf_token %}

                <!-- Username -->
                <div>
                    <label class="block text-sm text-slate-300 mb-1">
                        Username
                    </label>
                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        required
                        autocomplete="username"
                        class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder:text-slate-400 focus:border-primary focus:outline-none"
                        placeholder="Enter your username"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm text-slate-300 mb-1">
                        Password
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            required
                            autocomplete="current-password"
                            class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 pr-12 text-white placeholder:text-slate-400 focus:border-primary focus:outline-none"
                            placeholder="Enter your password"
                        >
                        <button
                            type="button"
                            class="password-toggle absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 hover:text-white"
                            data-target="id_password"
                            aria-label="Show password"
                        >
                            <span class="material-symbols-outlined text-xl toggle-icon">visibility_off</span>
                        </button>
                    </div>
                    
                </div>

                <!-- Errors -->
                {% if form.errors %}
                    <div class="text-red-400 text-sm">
                        Invalid username or password
                    </div>
                {% endif %}

                <!-- Button -->
                <button type="submit"
                    class="w-full mt-4 bg-primary text-white py-4 rounded-xl font-semibold 
                           hover:bg-primary/90 transition active:scale-95">
                    Login
                </button>
            </form>

            <!-- Divider -->
            <div class="my-6 border-t border-white/10"></div>

            <!-- Footer -->
            <p class="text-center text-sm text-slate-400">
                Don’t have an account?
                <a href="{% url 'accounts:register' %}" class="text-primary font-medium">                
                    <span class="text-primary font-medium">
                        Create account
                    </span>
                </a>
            </p>

        </div>

        <!-- Back Link -->
        <div class="text-center mt-6">
            <a href="/" class="text-slate-500 text-sm hover:text-white transition">
                ← Back to Home
            </a>
        </div>

    </div>

    <script>
        document.querySelectorAll('.password-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector('.toggle-icon');
                const isHidden = input.type === 'password';

                input.type = isHidden ? 'text' : 'password';
                icon.textContent = isHidden ? 'visibility' : 'visibility_off';
                btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            });
        });
    </script>
</body>
</html>
